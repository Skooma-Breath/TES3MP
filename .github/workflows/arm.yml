name: ARM64 Build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        
    - name: Setup QEMU for ARM64
      uses: docker/setup-qemu-action@v2
      
    - name: Build in ARM64 environment
      run: |
        # Create ARM64 Dockerfile
        cat << EOF > Dockerfile.arm64
        FROM arm64v8/ubuntu:22.04
        
        # Install dependencies
        RUN apt-get update && apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            ccache \
            git \
            libluajit-5.1-dev \
            liblua5.1-dev \
            libboost-system-dev \
            libboost-thread-dev \
            libsdl2-dev \
            libopenal-dev \
            libbullet-dev \
            libmygui-dev \
            libraknet-dev \
            qtbase5-dev \
            libqt5opengl5-dev \
            && rm -rf /var/lib/apt/lists/*
        
        WORKDIR /build
        COPY . .
        
        RUN mkdir build && cd build && \
            cmake .. \
              -DBUILD_OPENMW=OFF \
              -DBUILD_OPENMW_MP=ON \
              -DCMAKE_BUILD_TYPE=Release \
              -DOPENMW_USE_SYSTEM_BULLET=ON \
              -DOPENMW_USE_SYSTEM_MYGUI=ON \
              -DOPENMW_USE_SYSTEM_RECASTNAVIGATION=ON && \
            cmake --build . --target tes3mp-server -- -j\$(nproc)
        EOF
        
        # Build Docker image
        docker buildx build --platform linux/arm64 -f Dockerfile.arm64 -t tes3mp-arm64 .
        
        # Create container and copy binary
        docker create --name tes3mp-container --platform linux/arm64 tes3mp-arm64
        docker cp tes3mp-container:/build/build/apps/openmw-mp/tes3mp-server .
        docker rm tes3mp-container
        
    - name: Verify ARM64 binary
      run: |
        file tes3mp-server
        # Should show: ELF 64-bit LSB pie executable, ARM aarch64, version 1 (SYSV)...
        
    - name: Package artifact
      run: |
        mkdir -p package
        mv tes3mp-server package/
        cp tes3mp-server-default.cfg package/
        tar czf tes3mp-server-arm64.tar.gz -C package .
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: tes3mp-server-arm64
        path: tes3mp-server-arm64.tar.gz
